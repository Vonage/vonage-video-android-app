appId: ${APP_ID}
---
# E2E Test: Joining with an expired session key fails before joinSession
# Description: The `e2eExpiredSessionKey` launch argument makes the app replace the sessionKey
#   returned by POST /v2/createSession with a JWT whose `exp` is an hour in the past
#   (E2eExpiredSessionKeyInterceptor). The client must refuse to call /v2/joinSession, so the
#   meeting room shows the "This meeting link has expired." dialog (same wording as iOS)
#   and the call never starts.
# Note: unlike iOS, cancelling the error dialog leaves the meeting room through the
#   GoBack action, which the app routes to the goodbye screen.
# Priority: P1

- launchApp:
    clearState: true
    arguments:
      e2eExpiredSessionKey: true
    permissions:
      all: allow

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

- tapOn:
    id: "room-name-input"

- eraseText

- inputText: "${ROOM_NAME}"

- hideKeyboard

- tapOn:
    id: "join-waiting-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

- tapOn:
    id: "username-input"

- eraseText

- inputText: "Test User"

- hideKeyboard

- tapOn:
    id: "join-meeting-button"

- extendedWaitUntil:
    visible: "This meeting link has expired."
    timeout: 10000

# The call never connected
- assertNotVisible:
    id: "meeting-room-screen"

- takeScreenshot: 01-session-key-expired-error

- tapOn: "Cancel"

- waitForAnimationToEnd:
    timeout: 3000

- assertNotVisible:
    id: "meeting-room-screen"

- assertVisible:
    id: "goodbye-screen"

- takeScreenshot: 02-session-key-expired-left-room
