appId: ${APP_ID}
---
# E2E Test: GitHub Repo Link
# Description: Verify the GitHub repo button is visible on the Landing screen and tappable
# Priority: P1

- launchApp:
    clearState: true
    permissions:
      camera: allow
      microphone: allow

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

# Verify GitHub button is visible
- assertVisible:
    id: "github-repo-button"

- takeScreenshot: 01-github-button-visible

# Tap the GitHub button (opens external URL)
- tapOn:
    id: "github-repo-button"

- takeScreenshot: 02-after-github-tap
