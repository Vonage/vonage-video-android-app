appId: com.vonage.android.debug
---
# E2E Test: Launch App
# Description: Launch the app and validate the Landing screen is visible
# Priority: P0

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "landing_screen"
    timeout: 30000

- assertVisible:
    id: "landing_screen"

- assertVisible:
    id: "landing_screen_create_room_button"

- takeScreenshot: landing-screen
