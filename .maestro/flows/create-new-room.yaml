appId: ${APP_ID}
---
# E2E Test: Create Room and Join
# Description: Create a new room from Landing, enter username in Waiting Room, and join the Meeting Room
# Priority: P0

- launchApp:
    clearState: true
    permissions:
      camera: allow
      microphone: allow

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

- assertVisible:
    id: "landing-screen-create-room-button"

# Tap "Create a new room" — generates random room name and navigates to waiting room
- tapOn:
    id: "landing-screen-create-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

- takeScreenshot: 01-waiting-room-new-room

# Enter username and join meeting
- tapOn:
    id: "username-input"

- inputText: "Test User"

- hideKeyboard

- tapOn:
    id: "join-meeting-button"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "meeting-room-screen"

- takeScreenshot: 02-meeting-room
