appId: ${APP_ID}
---
# E2E Test: Open Participant List
# Description: Create a room, join, and open/close the participant list from the bottom bar
# Priority: P1

- launchApp:
    clearState: true
    permissions:
        all: allow

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

- tapOn:
    id: "landing-screen-create-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

- tapOn:
    id: "username-input"

- eraseText

- inputText: "Test User"

- hideKeyboard

- tapOn:
    id: "join-meeting-button"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "meeting-room-screen"

- tapOn:
    id: "bottom-bar-participants-button"

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    id: "search"

- takeScreenshot: 01-participants-list

- tapOn:
    id: "bottom-bar-participants-button"

- assertNotVisible:
    id: "search"
