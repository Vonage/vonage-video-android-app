detekt {
    buildUponDefaultConfig = true
    config.from(files("$projectDir/build-tools/detekt/detekt.yml"))
    basePath = files("$projectDir")
    source.from(fileTree(rootProject.projectDir) {
        exclude("**/.gradle/")
        exclude("**/build/")
        exclude("**/tmp/**")
        // Generated by :app:generateVonageConfig — not source, and including it makes Gradle
        // flag detekt for consuming that task's declared @OutputFile without a dependency.
        exclude("gradle/generated-config.properties")
    })
}