# Landing -> waiting room with a username set. No launchApp: memory-cycles.sh starts the app
# itself, so the baseline heap dump is taken from the same process the cycles run in.
appId: ${APP_ID}
---
- assertVisible:
    id: "landing-screen"

- tapOn:
    id: "room-name-input"

- eraseText

- inputText: "${ROOM_NAME}"

- hideKeyboard

- tapOn:
    id: "join-waiting-room-button"

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 15000

- tapOn:
    id: "username-input"

- eraseText

- inputText: "Profiling Bot"

- hideKeyboard
