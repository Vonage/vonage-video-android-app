name: Maestro UI Tests

permissions:
  contents: read
  actions: read
  pull-requests: write

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
  BASE_API_URL: ${{ secrets.BASE_API_URL }}

jobs:
  maestro-tests:
    name: Maestro Tests (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]

    steps:
      # Unique per run so concurrent runs (e.g. two open PRs, or debug+release in this
      # same run) never join the same real video room at the same time. run_id is
      # unique per workflow run; the PR number is appended only for readability.
      - name: Compute unique room name
        id: room
        run: echo "name=maestro-${{ github.run_id }}-${{ matrix.build-type }}${{ github.event.pull_request.number && format('-pr{0}', github.event.pull_request.number) || '' }}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Generate config
        run: |
          ./gradlew generateVonageConfig --info --stacktrace
          grep -Eq '^vonage\.baseApiUrl=https?://' gradle/generated-config.properties || {
            echo "Generated config does not contain a valid http(s) vonage.baseApiUrl."
            exit 1
          }

      - name: Build debug APK
        if: matrix.build-type == 'debug'
        run: |
          ./gradlew :app:assembleDebug --info --stacktrace --no-build-cache

      - name: Create placeholder google-services.json
        if: matrix.build-type == 'release'
        run: |
          mkdir -p app/src/release
          cat > app/src/release/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "maestro-ci-placeholder",
              "storage_bucket": "maestro-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.vonage.android"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "placeholder-not-a-real-key" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build release APK (minified, signed with fallback debug key)
        if: matrix.build-type == 'release'
        run: |
          ./gradlew :app:assembleRelease --info --stacktrace --no-build-cache

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel-34-default-x86_64-v1

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ROOM_NAME: ${{ steps.room.outputs.name }}
          APP_ID: ${{ matrix.build-type == 'release' && 'com.vonage.android' || 'com.vonage.android.debug' }}
          APK_PATH: ${{ matrix.build-type == 'release' && 'app/build/outputs/apk/release/app-release.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -netdelay none -netspeed full -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: |
            adb wait-for-device
            sleep 5

            mkdir -p test-reports
            adb logcat -c

            adb install -r "$APK_PATH"
            adb shell pm grant "$APP_ID" android.permission.CAMERA 2>/dev/null
            adb shell pm grant "$APP_ID" android.permission.RECORD_AUDIO 2>/dev/null
            adb shell pm grant "$APP_ID" android.permission.BLUETOOTH_CONNECT 2>/dev/null
            adb shell pm grant "$APP_ID" android.permission.POST_NOTIFICATIONS 2>/dev/null

            maestro --version
            maestro test --env APP_ID="$APP_ID" --env ROOM_NAME="$ROOM_NAME" .maestro/flows --format junit --output test-reports/maestro-junit.xml || { adb logcat -d -v time > test-reports/logcat.txt; exit 1; }

      - name: List Maestro test artifacts
        if: always()
        run: |
          echo "📁 Maestro test directory contents:"
          ls -la ~/.maestro/tests/ 2>/dev/null || echo "No tests directory"

          echo ""
          echo "📸 Screenshots found:"
          find ~/.maestro/tests -type f \( -name "*.png" -o -name "*.jpg" \) 2>/dev/null | head -20

      - name: Generate Test Report
        if: always()
        run: |
          mkdir -p test-reports
          cat > test-reports/maestro-summary.txt << EOF
          🎭 Maestro Test Execution Summary
          ==================================
          Run Number: ${{ github.run_number }}
          Timestamp: $(date)
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}

          Test Results Location:
          ~/.maestro/tests/

          Screenshots and test artifacts have been uploaded below.
          EOF

          if [ -d ~/.maestro/tests ]; then
            cp -r ~/.maestro/tests/* test-reports/ 2>/dev/null || true
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results-${{ github.run_number }}-${{ matrix.build-type }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ github.run_number }}-${{ matrix.build-type }}
          path: test-reports/
          retention-days: 7
          if-no-files-found: warn

  comment-pr:
    name: Update PR Comment
    needs: maestro-tests
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Update PR Comment with Results
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- maestro-e2e-results -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const results = ${{ toJson(needs.maestro-tests.result) }};

            const overallStatus = results === 'success' ? '✅ **All tests passed!**' : '❌ **Some tests failed**';

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();

            const entry = `- ${timestamp} — [Run #${context.runNumber}](${runUrl}) — commit \`${context.sha.substring(0, 7)}\` — ${results === 'success' ? '✅ passed' : '❌ failed'}`;

            // Find the existing bot comment for this check, so we update in place
            // instead of posting a new one on every run.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            // Preserve prior run history (capped) from the existing comment body.
            const historyMarkerStart = '<!-- history-start -->';
            const historyMarkerEnd = '<!-- history-end -->';
            let history = [];
            if (previous) {
              const start = previous.body.indexOf(historyMarkerStart);
              const end = previous.body.indexOf(historyMarkerEnd);
              if (start !== -1 && end !== -1) {
                const block = previous.body.substring(start + historyMarkerStart.length, end);
                history = block.split('\n').map(l => l.trim()).filter(Boolean);
              }
            }
            history.unshift(entry);
            history = history.slice(0, 10); // keep last 10 runs

            const body = `${marker}
            ## 🎭 Maestro E2E Test Results

            ${overallStatus}

            - **Latest run**: [#${context.runNumber}](${runUrl})
            - **Commit**: \`${context.sha}\`

            📊 **Artifacts:** see the \`maestro-report-${context.runNumber}-debug\` / \`-release\` artifacts on the run above for screenshots and logs.

            <details>
            <summary>📜 Run history (last ${history.length})</summary>

            ${historyMarkerStart}
            ${history.join('\n')}
            ${historyMarkerEnd}
            </details>`;

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
