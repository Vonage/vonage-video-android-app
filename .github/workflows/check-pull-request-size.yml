name: check-pull-request-size

on:
  pull_request:
    branches: [develop]
    types: [edited, opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-size:
    runs-on: ubuntu-24.04
    steps:
      - name: Check added lines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_ADDITIONS: 1500
        run: |
          set -e

          # Generated Baseline Profiles are machine output with tens of thousands of lines.
          ADDITIONS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.filename | contains("/generated/baselineProfiles/") | not) | .additions' \
            | awk '{ sum += $1 } END { print sum + 0 }')

          if (( ADDITIONS > MAX_ADDITIONS )); then
            echo "::error::PR adds $ADDITIONS lines, exceeding the limit of $MAX_ADDITIONS. Split it into smaller PRs."
            exit 1
          fi

          echo "PR adds $ADDITIONS lines excluding generated baseline profiles (limit $MAX_ADDITIONS) - VALID"
        shell: bash
